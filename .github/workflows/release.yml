# Publishes the crate to crates.io when a tag vX.Y.Z is pushed. The monorepo's sdk-mirror
# workflow pushes that tag for a monorepo tag sdk-rust-vX.Y.Z.
#
# Authentication is crates.io trusted publishing (OIDC): no token is stored. On crates.io the
# crate trusts this repository, workflow file "release.yml" and environment "crates-io".
# crates.io only lets you add a trusted publisher to a crate that already exists, so the very
# first publish uses a short-lived API token in the CARGO_REGISTRY_TOKEN secret (environment
# "crates-io"); delete it afterwards.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: v
        name: The tag, Cargo.toml and CHANGELOG.md agree
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          meta="$(cargo metadata --no-deps --format-version 1)"
          actual="$(jq -r '.packages[0].version' <<<"$meta")"
          [ "$actual" = "$v" ] || { echo "::error::Cargo.toml has version $actual but the tag is $GITHUB_REF_NAME"; exit 1; }
          grep -qF "## [$v]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$v]' section"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.packages[0].name' <<<"$meta")" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  crates-io:
    needs: [verify, test]
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ needs.verify.outputs.name }}/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # trusted publishing
    env:
      FIRST_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - id: published
        name: Already on crates.io? (a re-run)
        env:
          CRATE: ${{ needs.verify.outputs.name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -A "honk-me release (github.com/${GITHUB_REPOSITORY})" "https://crates.io/api/v1/crates/${CRATE}/${VERSION}")"
          if [ "$code" = 200 ]; then
            echo "::notice::${CRATE} ${VERSION} is already on crates.io, not publishing it again"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trusted publishing token (OIDC)
        id: auth
        if: steps.published.outputs.skip != 'true' && env.FIRST_PUBLISH_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish
        if: steps.published.outputs.skip != 'true'
        run: cargo publish
        env:
          # The OIDC token, or the first-publish token while trusted publishing is not set up.
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.FIRST_PUBLISH_TOKEN }}

  github-release:
    needs: [verify, crates-io]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: GitHub release with the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          NAME: ${{ needs.verify.outputs.name }}
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {f = 1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          # shellcheck disable=SC2016 # the backticks are a literal Markdown code fence
          printf '\n```sh\ncargo add %s@%s\n```\n' "$NAME" "$VERSION" >> notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
