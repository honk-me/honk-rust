# Tests on every push and pull request; release.yml calls it before publishing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: rust ${{ matrix.rust }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rust: stable }
          - { os: ubuntu-24.04, rust: '1.85' } # MSRV (rust-version in Cargo.toml)
          - { os: macos-latest, rust: stable }
          - { os: windows-latest, rust: stable }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust ${{ matrix.rust }}
        shell: bash
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal
          rustup default "${{ matrix.rust }}"
      - run: cargo test
      - run: cargo test --all-features # the blocking client

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: The package builds from what crates.io would get
        run: cargo publish --dry-run
